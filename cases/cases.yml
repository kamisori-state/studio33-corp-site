# よくあるお困りごと（トップページに新しい順で6件表示）
# 実際のお客さまの記録ではなく、よくあるご相談をもとにした「例」です。
# ハーメスが毎朝7時に1件ずつ書き足します。書き方は tools/build-cases.py の先頭を参照。

cases:
  - id: 2026-10-19-pc-slow
    date: 2026-10-19
    category: パソコン
    title: パソコンの起動に何分もかかる
    trouble: 電源を入れてから使えるようになるまで5分以上かかり、ネットを見るのも重い。買い替えるべきか迷っている。
    support: 起動時に自動で動くソフトや空き容量、更新の状態を確認し、不要なものを整理します。買い替えが必要かどうかも正直にお伝えします。
    price: トラブル診断 3,300円〜

  - id: 2026-10-20-printer-not-printing
    date: 2026-10-20
    category: パソコン
    title: 急にプリンターで印刷できなくなった
    trouble: いつも使っているプリンターにパソコンから印刷を指示しても、用紙が出てこない。画面には印刷待ちの書類が残っていて、必要な書類を印刷できず困っている。
    support: プリンターの電源や接続、エラー表示、パソコン側の印刷設定を確認し、原因に応じた設定の見直しや印刷待ちの整理を行います。作業内容と料金をご案内し、ご了承を得てから対応します。
    price: トラブル診断 3,300円〜

  - id: 2026-10-21-wifi-not-connected
    date: 2026-10-21
    category: インターネット・Wi-Fi
    title: Wi-Fiにつないでもネットが使えない
    trouble: パソコンにはWi-Fiの接続表示が出ているのに、ホームページを開けない。同じ家のスマートフォンでもネットが使えず、どこを確認すればよいか分からず困っている。
    support: パソコンの接続設定やルーターのランプ、配線の状態を確認し、不調の範囲を切り分けます。必要な設定の見直しや回線会社への確認事項をご案内し、作業は内容と料金にご了承を得てから行います。
    price: ネット・Wi-Fiの不調診断 3,300円〜

  - id: 2026-10-22-pc-no-sound
    date: 2026-10-22
    category: パソコン
    title: パソコンで動画を再生しても音が出ない
    trouble: パソコンで動画を再生すると映像は動くのに、スピーカーから音が出ない。音量を上げても変わらず、動画の説明を聞けないため、どの設定を確認すればよいか分からず困っている。
    support: 音量や消音、音の出力先、スピーカーの接続状態を確認し、原因に応じて設定の見直しや動作確認を行います。作業内容と料金をご案内し、ご了承を得てから対応します。
    price: トラブル診断 3,300円〜

  - id: 2026-10-23-keyboard-mouse-not-working
    date: 2026-10-23
    category: パソコン
    title: キーボードやマウスが反応しない
    trouble: パソコンの画面は表示されているのに、キーを押しても文字が入力されず、マウスも動かない。作業を続けられず、機器の故障なのか接続の問題なのか分からず困っている。
    support: キーボードやマウスの接続、電池の状態、パソコンの動作状況を確認し、原因に応じて接続や設定の見直しを行います。作業内容と料金をご案内し、ご了承を得てから対応します。
    price: トラブル診断 3,300円〜

  - id: 2026-10-24-virus-warning
    date: 2026-10-24
    category: セキュリティ
    title: ウイルス感染の警告が突然表示された
    trouble: パソコンでホームページを見ていると、ウイルスに感染したという警告と電話番号が表示されている。本物の警告か判断できず、画面を閉じてよいのか分からず困っている。
    support: 警告の表示内容やブラウザーの状態、操作した内容を確認し、状況に応じた画面の閉じ方や安全確認をご案内します。作業内容と料金をご説明し、ご了承を得てから対応します。
    price: セキュリティ対策 3,300円〜

  - id: 2026-10-25-pc-wont-turn-on
    date: 2026-10-25
    category: パソコン
    title: パソコンの電源ボタンを押しても起動しない
    trouble: いつも使っているパソコンの電源ボタンを押しても、ランプがつかず画面も表示されない。電源コードはつないでいるが反応がなく、必要な書類を開けず困っている。
    support: 電源コードやコンセント、充電器の接続、ランプの状態を確認し、電源まわりの問題を切り分けます。作業内容と料金をご案内し、ご了承を得てから対応します。修理が必要な場合は相談先をご案内します。
    price: トラブル診断 3,300円〜

  - id: 2026-10-26-online-meeting-camera-mic
    date: 2026-10-26
    category: パソコン
    title: オンライン会議でカメラやマイクが使えない
    trouble: パソコンでオンライン会議に参加しているが、自分の映像が映らず、声も相手に届かない。会議の画面は開けているのに、どの設定を確認すればよいか分からず困っている。
    support: カメラやマイクの接続、会議ソフトの機器選択、利用許可の設定を確認し、原因に応じて設定の見直しや動作確認を行います。作業内容と料金をご案内し、ご了承を得てから対応します。
    price: トラブル診断 3,300円〜

  - id: 2026-10-27-photo-backup
    date: 2026-10-27
    category: データ・バックアップ
    title: パソコンの写真をバックアップしていない
    trouble: 家族の写真をパソコンに保存しているが、ほかの場所にはコピーしていない。故障したときに写真が見られなくなるのが心配で、何を用意してどう保存すればよいか分からず困っている。
    support: 写真の保存場所や容量、現在お使いの保存機器を確認し、ご希望に合ったバックアップ方法と操作手順をご案内します。作業内容と料金をご説明し、ご了承を得てから対応します。
    price: 使い方レッスン60分 3,300円

  - id: 2026-10-28-pc-update-not-finishing
    date: 2026-10-28
    category: パソコン
    title: パソコンの更新が終わらず使えない
    trouble: パソコンに更新中の画面が表示されたまま、長い時間がたっても使える状態にならない。電源を切ってよいか判断できず、必要な書類の確認や作業を始められず困っている。
    support: 更新画面の表示や経過時間、電源の接続状態を確認し、状況に応じて待機の判断や必要な確認手順をご案内します。作業内容と料金をご説明し、ご了承を得てから対応します。
    price: トラブル診断 3,300円〜

  - id: 2026-10-29-usb-not-recognized
    date: 2026-10-29
    category: パソコン
    title: USBメモリーを挿しても表示されない
    trouble: パソコンにUSBメモリーを挿しても、保存した書類が表示されない。別の差し込み口でも見つからず、必要なファイルを開けなくて困っている。
    support: USBメモリーの接続状態やパソコンの認識状況を確認し、状況に応じて接続や設定の見直しを行います。作業内容と料金をご説明し、ご了承を得てから対応します。
    price: トラブル診断 3,300円〜


  - id: 2026-10-30-suspicious-email
    date: 2026-10-30
    category: セキュリティ
    title: 怪しいメールを開いてしまった
    trouble: 届いたメールを開いたところ、身に覚えのない請求とリンクが表示されている。本物の連絡か判断できず、リンクを押してよいのか分からなくて困っている。
    support: メールの表示内容やリンクを開いたかどうかを確認し、状況に応じた安全確認や今後の対処方法をご案内します。作業内容と料金をご説明し、ご了承を得てから対応します。
    price: セキュリティ対策 3,300円〜

  - id: 2026-10-31-screen-black
    date: 2026-10-31
    category: パソコン
    title: パソコンの電源は入るのに画面が映らない
    trouble: パソコンの電源ランプは点灯しているのに、画面が黒いままで何も表示されない。書類を開けず、画面や接続のどこを確認すればよいか分からず困っている。
    support: 画面の明るさや外部ディスプレイの電源、ケーブルの接続状態を確認し、状況に応じて表示設定や接続を見直します。作業内容と料金をご説明し、ご了承を得てから対応します。
    price: トラブル診断 3,300円〜


  - id: 2026-11-01-small-text
    date: 2026-11-01
    category: パソコン
    title: パソコンの文字が小さくて読みにくい
    trouble: パソコンで書類やホームページを開くと文字が小さく表示され、内容を読むのに困っている。画面全体を見やすくする設定がどこにあるのか分からない。
    support: 画面の解像度や拡大率、文字サイズの設定を確認し、見やすさのご希望に合わせた調整方法をご案内します。作業内容と料金をご説明し、ご了承を得てから対応します。
    price: 使い方レッスン60分 3,300円


  - id: 2026-11-02-storage-full
    date: 2026-11-02
    category: データ・バックアップ
    title: パソコンの保存容量がいっぱいと表示される
    trouble: パソコンに保存容量が不足していると表示され、書類や写真を保存できず困っている。何が容量を使っているのか、どのファイルを整理してよいのか分からない。
    support: 保存領域の空き容量やファイルの保存状況を確認し、必要なデータを伺いながら整理方法をご案内します。作業内容と料金をご説明し、ご了承を得てから対応します。
    price: トラブル診断 3,300円〜

  - id: 2026-11-03-mail-send-receive
    date: 2026-11-03
    category: パソコン
    title: パソコンでメールを送受信できない
    trouble: パソコンのメールソフトを開いても新しいメールが届かず、送ったメールも送信待ちのままになっている。必要な連絡を確認できず困っている。
    support: インターネットへの接続やメールソフトの表示、アカウント設定を確認し、状況に応じた設定の見直しをご案内します。作業内容と料金をご説明し、ご了承を得てから対応します。
    price: トラブル診断 3,300円〜

  - id: 2026-11-04-pc-initial-setup
    date: 2026-11-04
    category: パソコン
    title: 新しいパソコンの初期設定が分からない
    trouble: 新しく購入したパソコンの電源を入れたが、初期設定の画面で何を選べばよいか分からない。ネットへの接続や普段使うための準備を進められず困っている。
    support: パソコンの設定画面やご利用のネット環境、ご希望の使い方を確認し、必要な初期設定や接続をお手伝いします。作業内容と料金をご説明し、ご了承を得てから対応します。
    price: パソコン初期設定 6,600円〜

  - id: 2026-11-05-forgot-password
    date: 2026-11-05
    category: パソコン
    title: パソコンのパスワードを忘れて入れない
    trouble: 久しぶりにパソコンを使おうとしたら、ログイン画面のパスワードを思い出せない。何度入力しても通らず、中の写真や書類が見られなくて困っている。
    support: ログイン画面の表示やサインインの方法を確認し、お客さま本人のパソコンであることをうかがったうえで、入れるようにする手順をご案内します。状況により難しい場合もあります。
    price: トラブル診断 3,300円〜

  - id: 2026-11-06-data-transfer
    date: 2026-11-06
    category: データ・バックアップ
    title: 古いパソコンからデータを移したい
    trouble: 新しいパソコンに買い替えたが、古いパソコンの写真や文書をどう移せばよいか分からない。大切なデータが消えないか不安で、そのままになっている。
    support: 古いパソコンに入っているデータの種類と量、移し先の環境を確認し、作業前に内容を説明したうえで新しいパソコンへの移行を進めます。
    price: データ移行 6,600円〜

  - id: 2026-11-07-fan-noisy-slow
    date: 2026-11-07
    category: パソコン
    title: パソコンが重く、ファンの音が大きい
    trouble: パソコンを使っていると動作が重くなり、ファンが大きな音で回り続けている。本体も熱くなっていて、このまま使って大丈夫か不安で困っている。
    support: 動作が重くなる原因や、起動中のソフト、本体まわりの状態を確認し、対処の方法をご説明します。内容と料金にご納得いただいてから作業します。
    price: トラブル診断 3,300円〜

  - id: 2026-11-08-slow-wifi
    date: 2026-11-08
    category: インターネット・Wi-Fi
    title: Wi-Fiが遅く、動画がよく止まる
    trouble: 家でWi-Fiにつなぐと、動画が途中で止まったり、ページの表示に時間がかかったりする。時間帯や部屋によっても違い、原因が分からず困っている。
    support: つないでいる機器の数やルーターの置き場所、電波の届き方を確認し、改善の方法をご説明します。内容と料金にご納得いただいてから作業します。
    price: ネット・Wi-Fiの不調診断 3,300円〜

  - id: 2026-11-09-printer-wifi-setup
    date: 2026-11-09
    category: インターネット・Wi-Fi
    title: プリンターをWi-Fiにつなぎたい
    trouble: 新しいプリンターを買ったが、家のWi-Fiにつなぐ方法が分からない。説明書を見ても設定が進まず、スマホやパソコンから印刷できずに困っている。
    support: プリンターとWi-Fiルーターの状態を確認し、ネットへの接続設定を行います。パソコンやスマホから印刷できるかも合わせて確認します。
    price: プリンター・テレビのネット接続 3,300円

  - id: 2026-11-10-screen-freeze
    date: 2026-11-10
    category: パソコン
    title: パソコンの画面が固まって動かない
    trouble: 作業中に画面が固まり、マウスを動かしても何も反応しない。保存していない書類があり、電源を切ってよいか分からず困っている。
    support: 固まる頻度や直前の操作、空き容量や起動中のアプリの状態を確認し、考えられる原因を絞り込んで対応方法をご説明します。
    price: トラブル診断 3,300円〜

  - id: 2026-11-11-browser-popup-ads
    date: 2026-11-11
    category: セキュリティ
    title: ネットを見ていると広告が勝手に開く
    trouble: ネットを見ていると、関係のない広告の画面が次々に開く。閉じてもまた表示され、怪しいボタンを押してしまわないか不安で困っている。
    support: ブラウザの設定や追加された機能、セキュリティ対策の状態を確認し、広告が出る原因を絞り込んで対応します。今後の注意点もご説明します。
    price: セキュリティ対策 3,300円〜

  - id: 2026-11-12-smartphone-photos-to-pc
    date: 2026-11-12
    category: パソコン
    title: スマホの写真をパソコンに取り込めない
    trouble: スマホをケーブルでパソコンにつないでも、写真が表示されず取り込めない。スマホの容量がいっぱいに近く、写真を移したいのでどうすればよいか困っている。
    support: ケーブルやスマホ側の接続設定、パソコンの認識状況を確認し、写真を安全にパソコンへ移せる状態に整えます。取り込み方法もご説明します。
    price: トラブル診断 3,300円〜

  - id: 2026-11-13-laptop-battery-drains
    date: 2026-11-13
    category: パソコン
    title: ノートパソコンの電池がすぐなくなる
    trouble: 充電したはずのノートパソコンが、数十分で電池切れになってしまう。外出先で使えず、コンセントのそばでしか作業できないので困っている。
    support: 電池の状態や、電池を多く使っているアプリ、設定の内容を確認し、原因を切り分けます。設定の見直しや使い方のご案内を行います。
    price: トラブル診断 3,300円〜

  - id: 2026-11-14-deleted-file
    date: 2026-11-14
    category: データ・バックアップ
    title: 大事なファイルを間違えて消してしまった
    trouble: パソコンで作業中に、仕事や家族の大事なファイルを間違えて消してしまった。ごみ箱を見ても見当たらず、元に戻せるのか分からなくて困っている。
    support: ごみ箱や保存先、バックアップの有無を確認し、戻せる可能性のある方法を調べます。状況をご説明し、今後の備え方もご案内します。
    price: トラブル診断 3,300円〜

  - id: 2026-11-15-tv-internet
    date: 2026-11-15
    category: インターネット・Wi-Fi
    title: テレビでネット動画が見られない
    trouble: 新しいテレビを買ったが、家のWi-Fiにつなぐ方法が分からない。ネット動画を見ようとしても接続できず、設定画面で止まってしまい困っている。
    support: テレビとWi-Fiルーターの状態を確認し、ネットへの接続設定を行います。動画が表示できるかも合わせて確認し、基本の使い方をご説明します。
    price: プリンター・テレビのネット接続 3,300円

  - id: 2026-11-16-new-router-no-connect
    date: 2026-11-16
    category: インターネット・Wi-Fi
    title: ルーターを替えたらスマホがつながらない
    trouble: Wi-Fiルーターを新しくしたところ、パソコンやスマホがネットにつながらなくなった。設定の進め方が分からず、家族の端末も使えず困っている。
    support: ルーターと回線の接続状態を確認し、Wi-Fiの設定を行います。パソコンやスマホなど、お使いの端末が接続できるかも合わせて確認します。
    price: Wi-Fiルーター設定 4,400円

  - id: 2026-11-17-wifi-weak-room
    date: 2026-11-17
    category: インターネット・Wi-Fi
    title: 家の奥の部屋だけWi-Fiが届かない
    trouble: リビングではネットが使えるのに、奥の部屋ではWi-Fiの電波が弱く、動画や会議が途切れてしまう。ルーターの置き場所を変えても改善せず、どうすればよいか分からず困っている。
    support: 電波が弱い部屋とルーターの位置関係を確認し、中継機やメッシュWi-Fiが適しているかご説明します。ご了承いただいてから設置と接続の設定を行います。
    price: 中継機・メッシュWi-Fi設置 4,400円〜（機器代別）
  - id: 2026-11-18-smartphone-video-call
    date: 2026-11-18
    category: パソコン
    title: スマホでビデオ通話のやり方が分からない
    trouble: 離れて暮らす家族からビデオ通話に誘われたが、アプリの入れ方や、通話の始め方、カメラと音声の設定が分からない。操作を間違えそうで、なかなか試せずに困っている。
    support: お使いのスマホの状態を確認し、アプリの準備から通話の始め方、カメラや音声の設定まで、一緒に操作しながらご説明します。ご希望に合わせて進め方を決めます。
    price: 使い方レッスン60分 3,300円
  - id: 2026-11-19-wifi-password-unknown
    date: 2026-11-19
    category: インターネット・Wi-Fi
    title: 自宅のWi-Fiのパスワードが分からず新しい機器をつなげない
    trouble: 新しいスマホやタブレットをWi-Fiにつなごうとしている。パスワードが分からず、ルーターの設定も見つからず困っている。
    support: ルーターの表示や接続中の機器の状況を確認し、お使いの端末をWi-Fiにつなぐ作業を行います。
    price: 端末の追加接続 1,100円
  - id: 2026-11-20-sms-link-tapped
    date: 2026-11-20
    category: セキュリティ
    title: 不審なSMSのリンクを押してしまった
    trouble: 宅配便の不在通知のようなSMSが届き、よく確認せずリンクを押してしまった。画面にIDやパスワードの入力欄が出たが、入力してよかったのか分からず不安で困っている。
    support: 届いたSMSと開いた画面の内容を確認し、入力した情報の有無を伺います。そのうえでパスワードの変更や端末の設定など、必要な対策を順番にご案内し、一緒に進めます。
    price: セキュリティ対策 3,300円〜
  - id: 2026-11-21-internet-not-connecting
    date: 2026-11-21
    category: インターネット・Wi-Fi
    title: 急にインターネットにつながらなくなった
    trouble: 昨日まで使えていたのに、パソコンでもスマホでもネットが見られなくなった。ルーターのランプの状態も分からず、どこから確認すればよいか分からず困っている。
    support: ルーターや機器の接続状況、配線、設定を順に確認し、原因を切り分けたうえで、必要な対応をご案内します。
    price: ネット・Wi-Fiの不調診断 3,300円〜
  - id: 2026-11-22-file-wont-open
    date: 2026-11-22
    category: パソコン
    title: 届いた書類のファイルが開けない
    trouble: メールで届いたWordやExcelのファイルをダブルクリックしても開けない。エラーの表示が出るだけで、どうすればよいか分からず困っている。
    support: ファイルの形式、関連づけられているアプリ、エラーの内容を確認し、原因を切り分けたうえで、必要な対応をご案内します。
    price: トラブル診断 3,300円〜
  - id: 2026-11-23-pc-clock-wrong
    date: 2026-11-23
    category: パソコン
    title: パソコンの時計が実際の時刻とずれている
    trouble: パソコンの画面に表示される時計が実際の時刻とずれていて、予定の時間や予約の時刻が分からなくなる。直し方が分からず、そのまま使っている。
    support: 日付と時刻、地域の設定を確認し、正しい時刻に合わせる作業を行います。ずれの原因が設定にあるかを調べ、再発を防ぐための確認もご案内します。
    price: トラブル診断 3,300円〜
  - id: 2026-11-24-pc-screen-rotated
    date: 2026-11-24
    category: パソコン
    title: パソコンの画面が横向きや逆さまになった
    trouble: パソコンを使っていたら、画面が急に横向きや逆さまになってしまった。マウスの動きも合わなくなり、元に戻し方が分からず困っている。
    support: 画面の向きの設定やキーの操作、ディスプレイの設定を確認し、元の向きに戻す作業を行います。再び起きないよう、原因になりやすい操作もご案内します。
    price: トラブル診断 3,300円〜
  - id: 2026-11-25-phone-data-transfer
    date: 2026-11-25
    category: データ・バックアップ
    title: スマホの機種変更でデータの移し方が分からない
    trouble: 新しいスマホに買い替えたが、写真や連絡先を古いスマホから移す方法が分からない。消えてしまわないか不安で、手をつけられず困っている。
    support: 移したいデータの種類と、古いスマホ・新しいスマホの状態を確認し、移行の手順をご説明しながら作業します。移行後の表示も一緒に確認します。
    price: データ移行 6,600円〜
  - id: 2026-11-27-download-location
    date: 2026-11-27
    category: パソコン
    title: ダウンロードした書類の保存先が分からない
    trouble: パソコンで申込書をダウンロードしたのに、どのフォルダーに保存されたのか分からない。印刷したいが、書類を見つけられず困っている。
    support: お使いのブラウザーでダウンロード履歴を一緒に確認し、保存先のフォルダーを開く手順をご案内します。次に書類を保存するときの保存先の確かめ方もご説明します。
    price: 使い方レッスン60分 3,300円
  - id: 2026-11-28-japanese-input
    date: 2026-11-28
    category: パソコン
    title: キーボードで英字しか打てず、日本語に切り替えられない
    trouble: 検索欄に「さくら」と入れたいのに、「sakura」と英字のまま表示される。どこで日本語入力に切り替えるのか分からず困っている。
    support: 画面の入力モード表示を一緒に確認し、お使いのパソコンでひらがなに切り替える方法をご案内します。検索欄で実際に入力しながら、英字に戻す操作も練習します。

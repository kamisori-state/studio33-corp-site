# よくあるお困りごと（トップページに新しい順で6件表示）
# 実際のお客さまの記録ではなく、よくあるご相談をもとにした「例」です。
# ハーメスが毎朝7時に1件ずつ書き足します。書き方は tools/build-cases.py の先頭を参照。

cases:
  - id: 2026-10-19-pc-slow
    date: 2026-10-19
    category: パソコン
    title: パソコンの起動に何分もかかる
    trouble: 電源を入れてから使えるようになるまで5分以上かかり、ネットを見るのも重い。買い替えるべきか迷っている。
    support: 起動時に自動で動くソフトや空き容量、更新の状態を確認し、不要なものを整理します。買い替えが必要かどうかも正直にお伝えします。
    price: トラブル診断 3,300円〜

  - id: 2026-10-20-printer-not-printing
    date: 2026-10-20
    category: パソコン
    title: 急にプリンターで印刷できなくなった
    trouble: いつも使っているプリンターにパソコンから印刷を指示しても、用紙が出てこない。画面には印刷待ちの書類が残っていて、必要な書類を印刷できず困っている。
    support: プリンターの電源や接続、エラー表示、パソコン側の印刷設定を確認し、原因に応じた設定の見直しや印刷待ちの整理を行います。作業内容と料金をご案内し、ご了承を得てから対応します。
    price: トラブル診断 3,300円〜

  - id: 2026-10-21-wifi-not-connected
    date: 2026-10-21
    category: インターネット・Wi-Fi
    title: Wi-Fiにつないでもネットが使えない
    trouble: パソコンにはWi-Fiの接続表示が出ているのに、ホームページを開けない。同じ家のスマートフォンでもネットが使えず、どこを確認すればよいか分からず困っている。
    support: パソコンの接続設定やルーターのランプ、配線の状態を確認し、不調の範囲を切り分けます。必要な設定の見直しや回線会社への確認事項をご案内し、作業は内容と料金にご了承を得てから行います。
    price: ネット・Wi-Fiの不調診断 3,300円〜

  - id: 2026-10-22-pc-no-sound
    date: 2026-10-22
    category: パソコン
    title: パソコンで動画を再生しても音が出ない
    trouble: パソコンで動画を再生すると映像は動くのに、スピーカーから音が出ない。音量を上げても変わらず、動画の説明を聞けないため、どの設定を確認すればよいか分からず困っている。
    support: 音量や消音、音の出力先、スピーカーの接続状態を確認し、原因に応じて設定の見直しや動作確認を行います。作業内容と料金をご案内し、ご了承を得てから対応します。
    price: トラブル診断 3,300円〜

  - id: 2026-10-23-keyboard-mouse-not-working
    date: 2026-10-23
    category: パソコン
    title: キーボードやマウスが反応しない
    trouble: パソコンの画面は表示されているのに、キーを押しても文字が入力されず、マウスも動かない。作業を続けられず、機器の故障なのか接続の問題なのか分からず困っている。
    support: キーボードやマウスの接続、電池の状態、パソコンの動作状況を確認し、原因に応じて接続や設定の見直しを行います。作業内容と料金をご案内し、ご了承を得てから対応します。
    price: トラブル診断 3,300円〜

  - id: 2026-10-24-virus-warning
    date: 2026-10-24
    category: セキュリティ
    title: ウイルス感染の警告が突然表示された
    trouble: パソコンでホームページを見ていると、ウイルスに感染したという警告と電話番号が表示されている。本物の警告か判断できず、画面を閉じてよいのか分からず困っている。
    support: 警告の表示内容やブラウザーの状態、操作した内容を確認し、状況に応じた画面の閉じ方や安全確認をご案内します。作業内容と料金をご説明し、ご了承を得てから対応します。
    price: セキュリティ対策 3,300円〜

  - id: 2026-10-25-pc-wont-turn-on
    date: 2026-10-25
    category: パソコン
    title: パソコンの電源ボタンを押しても起動しない
    trouble: いつも使っているパソコンの電源ボタンを押しても、ランプがつかず画面も表示されない。電源コードはつないでいるが反応がなく、必要な書類を開けず困っている。
    support: 電源コードやコンセント、充電器の接続、ランプの状態を確認し、電源まわりの問題を切り分けます。作業内容と料金をご案内し、ご了承を得てから対応します。修理が必要な場合は相談先をご案内します。
    price: トラブル診断 3,300円〜

  - id: 2026-10-26-online-meeting-camera-mic
    date: 2026-10-26
    category: パソコン
    title: オンライン会議でカメラやマイクが使えない
    trouble: パソコンでオンライン会議に参加しているが、自分の映像が映らず、声も相手に届かない。会議の画面は開けているのに、どの設定を確認すればよいか分からず困っている。
    support: カメラやマイクの接続、会議ソフトの機器選択、利用許可の設定を確認し、原因に応じて設定の見直しや動作確認を行います。作業内容と料金をご案内し、ご了承を得てから対応します。
    price: トラブル診断 3,300円〜

  - id: 2026-10-27-photo-backup
    date: 2026-10-27
    category: データ・バックアップ
    title: パソコンの写真をバックアップしていない
    trouble: 家族の写真をパソコンに保存しているが、ほかの場所にはコピーしていない。故障したときに写真が見られなくなるのが心配で、何を用意してどう保存すればよいか分からず困っている。
    support: 写真の保存場所や容量、現在お使いの保存機器を確認し、ご希望に合ったバックアップ方法と操作手順をご案内します。作業内容と料金をご説明し、ご了承を得てから対応します。
    price: 使い方レッスン60分 3,300円

  - id: 2026-10-28-pc-update-not-finishing
    date: 2026-10-28
    category: パソコン
    title: パソコンの更新が終わらず使えない
    trouble: パソコンに更新中の画面が表示されたまま、長い時間がたっても使える状態にならない。電源を切ってよいか判断できず、必要な書類の確認や作業を始められず困っている。
    support: 更新画面の表示や経過時間、電源の接続状態を確認し、状況に応じて待機の判断や必要な確認手順をご案内します。作業内容と料金をご説明し、ご了承を得てから対応します。
    price: トラブル診断 3,300円〜

  - id: 2026-10-29-usb-not-recognized
    date: 2026-10-29
    category: パソコン
    title: USBメモリーを挿しても表示されない
    trouble: パソコンにUSBメモリーを挿しても、保存した書類が表示されない。別の差し込み口でも見つからず、必要なファイルを開けなくて困っている。
    support: USBメモリーの接続状態やパソコンの認識状況を確認し、状況に応じて接続や設定の見直しを行います。作業内容と料金をご説明し、ご了承を得てから対応します。
    price: トラブル診断 3,300円〜


  - id: 2026-10-30-suspicious-email
    date: 2026-10-30
    category: セキュリティ
    title: 怪しいメールを開いてしまった
    trouble: 届いたメールを開いたところ、身に覚えのない請求とリンクが表示されている。本物の連絡か判断できず、リンクを押してよいのか分からなくて困っている。
    support: メールの表示内容やリンクを開いたかどうかを確認し、状況に応じた安全確認や今後の対処方法をご案内します。作業内容と料金をご説明し、ご了承を得てから対応します。
    price: セキュリティ対策 3,300円〜

  - id: 2026-10-31-screen-black
    date: 2026-10-31
    category: パソコン
    title: パソコンの電源は入るのに画面が映らない
    trouble: パソコンの電源ランプは点灯しているのに、画面が黒いままで何も表示されない。書類を開けず、画面や接続のどこを確認すればよいか分からず困っている。
    support: 画面の明るさや外部ディスプレイの電源、ケーブルの接続状態を確認し、状況に応じて表示設定や接続を見直します。作業内容と料金をご説明し、ご了承を得てから対応します。
    price: トラブル診断 3,300円〜

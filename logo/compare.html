<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>ロゴ案</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>body{margin:0;padding:28px;font-family:"Noto Sans JP",sans-serif;background:#fff;color:#16232a}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.card{border:1px solid #e3eaec;border-radius:16px;padding:22px}
h2{margin:0 0 12px;font-size:20px}.big{width:100%;height:auto}.row{display:flex;gap:14px;align-items:center;margin-top:16px}
.dark{background:#16232a;border-radius:10px;padding:12px}.icon{width:56px;height:56px;border-radius:12px;overflow:hidden;border:1px solid #e3eaec}
p{color:#5d6b72;margin:10px 0 0;font-size:14px}</style></head><body>
<div class="grid">
<div class="card"><h2>A案 バッジ型</h2><object class="big" data="logo-a.svg"></object><p>「33」を角丸の四角に入れた、親しみやすく覚えやすい形。アイコンにしやすい。</p></div>
<div class="card"><h2>B案 パソコン型</h2><object class="big" data="logo-b.svg"></object><p>ノートパソコンの画面にチェック印。「パソコンを直す・解決する」がひと目で伝わる。</p></div>
<div class="card"><h2>C案 吹き出し型</h2><object class="big" data="logo-c.svg"></object><p>オレンジの吹き出し。「気軽に相談できる」やさしさを前に出した形。</p></div>
<div class="card"><h2>D案 つながる輪</h2><object class="big" data="logo-d.svg"></object><p>重なる2つの輪で「寄り添う・つながる」を表現。落ち着いた大人っぽい印象。</p></div>
</div></body></html>
